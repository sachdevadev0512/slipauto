<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slip Generator - Multi-Company</title>
    <meta name="description" content="Automated slip generation system. Generate and print shipping slips for multiple companies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1>Slip Generator</h1>
            <p class="header-subtitle">Multi-Company Slip Generation System</p>
        </div>
    </header>

    <main class="app-main">
        <!-- LEFT: Input Form -->
        <section class="form-section">
            <div class="form-card">
                <h2 class="form-title">Enter Slip Details</h2>

                <form id="slipForm" novalidate>
                    <div class="form-group">
                        <label for="companySelect">Company</label>
                        <select id="companySelect" required>
                            <option value="" disabled selected>-- Select Company --</option>
                            <option value="HARI MEDI PHARMA">HARI MEDI PHARMA</option>
                            <option value="ALIVIRA">ALIVIRA</option>
                            <option value="GANPATI">GANPATI</option>
                            <option value="NUTRICA">NUTRICA</option>
                            <option value="WOCKHARDT">WOCKHARDT</option>
                        </select>
                        <span class="error-msg" id="companySelectError"></span>
                    </div>

                    <div class="form-group">
                        <label for="billNumber">Bill Number</label>
                        <input type="text" id="billNumber" inputmode="numeric" pattern="[0-9]*" placeholder="2760" required>
                        <span class="error-msg" id="billNumberError"></span>
                    </div>

                    <div class="form-group">
                        <label for="cartonCount">Number of Cases</label>
                        <input type="text" id="cartonCount" inputmode="numeric" pattern="[0-9]*" placeholder="9" required>
                        <span class="error-msg" id="cartonCountError"></span>
                    </div>

                    <div class="form-group">
                        <label for="station">Station</label>
                        <input type="text" id="station" placeholder="Jaipur / जयपुर" required>
                        <span class="error-msg" id="stationError"></span>
                    </div>

                    <div class="form-group">
                        <label for="transport">Transport</label>
                        <input type="text" id="transport" placeholder="XYZ Transport / श्री गणेश ट्रांसपोर्ट" required>
                        <span class="error-msg" id="transportError"></span>
                    </div>

                    <div class="total-slips-display" id="totalSlipsDisplay">
                        Total Slips: <strong id="totalSlipsCount">0</strong>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary" id="generateBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                            Generate Slips
                        </button>
                        <button type="button" class="btn btn-secondary" id="downloadPdfBtn" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Download PDF
                        </button>
                        <button type="button" class="btn btn-secondary" id="printBtn" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 6,2 18,2 18,9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                            Print Slips
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- RIGHT: Live Preview -->
        <section class="preview-section">
            <h2 class="preview-title">Live Preview</h2>
            <div class="preview-container">
                <div class="slip-template-img" id="previewSlip">
                    <img id="templateImage" src="" alt="Slip Template" style="display:none;">
                    <div class="overlay-pmhmp" id="previewPmhmp"></div>
                    <div class="overlay-cases" id="previewCases"></div>
                    <div class="overlay-station" id="previewStation"></div>
                    <div class="overlay-transport" id="previewTransport"></div>
                </div>
            </div>
            <div class="preview-note" id="previewNote">Select a company to see the template</div>
        </section>
    </main>

    <!-- Hidden container for generated slips (used for PDF/Print) -->
    <div id="slipsContainer" class="slips-print-container"></div>

    <!-- Status overlay -->
    <div class="status-overlay" id="statusOverlay">
        <div class="status-card">
            <div class="spinner"></div>
            <p id="statusText">Generating slips...</p>
        </div>
    </div>

    <script src="app.js?v=35"></script>
</body>
</html>
